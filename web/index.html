<!DOCTYPE html>
<html>
    <head>
        <!--

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Aman Ansari — Mobile App Developer with 5+ years of experience building cross-platform apps with Flutter & Swift. View portfolio, projects, and contact." />
        <meta name="keywords" content="Flutter developer, Mobile App Developer, iOS developer, Swift, Dart, BLoC, Firebase, portfolio" />
        <meta name="author" content="Aman Ansari" />

        <!-- Open Graph (LinkedIn, WhatsApp, Facebook previews) -->
        <meta property="og:title" content="Aman Ansari — Mobile App Developer" />
        <meta property="og:description" content="5+ years building cross-platform apps with Flutter & Swift. 10+ production apps, 50K+ downloads." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://amanansariportfolio.netlify.app" />
        <meta property="og:image" content="https://amanansariportfolio.netlify.app/assets/assets/images/dev_image.png" />
        <meta property="og:image:width" content="800" />
        <meta property="og:image:alt" content="Aman Ansari - Mobile App Developer" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Aman Ansari — Mobile App Developer" />
        <meta name="twitter:description" content="5+ years building cross-platform apps with Flutter & Swift. 10+ production apps, 50K+ downloads." />
        <meta name="twitter:image" content="https://amanansariportfolio.netlify.app/assets/assets/images/dev_image.png" />

        <!-- iOS meta tags & icons -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Aman Ansari" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Aman Ansari | Mobile App Developer</title>
        <link rel="manifest" href="manifest.json" />

        <script>
            // The value below is injected by flutter build, do not touch.
            var serviceWorkerVersion = null;
        </script>
        <!-- This script adds the flutter initialization JS code -->
        <script src="flutter.js" defer></script>
        <style>
            .container {
                margin: 0;
                position: absolute;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .loader {
                height: 30vh;
            }
        </style>
    </head>

    <body style="overflow: hidden">
        <div class="container">
            <img class="loader" src="assets/loading.gif" />
        </div>
        <script>
            window.addEventListener('load', function (ev) {
                // Download main.dart.js
                _flutter.loader.loadEntrypoint({
                    serviceWorker: {
                        serviceWorkerVersion: serviceWorkerVersion,
                    },
                    onEntrypointLoaded: function (engineInitializer) {
                        engineInitializer
                            .initializeEngine()
                            .then(function (appRunner) {
                                appRunner.runApp();
                            });
                    },
                });
            });
        </script>
        <script>
            window.addEventListener('flutter-first-frame', function () {
                var el = document.getElementsByClassName('container')[0];
                el.remove();
            });
        </script>
    </body>
</html>
