        <style>
            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #0A0A14;
                color: #FFFFFF;
                font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            #loading-view {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0A0A14;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 999999;
                opacity: 1;
                transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                pointer-events: none;
                overflow: hidden;
            }

            #loading-view.fade-out {
                opacity: 0;
                transform: scale(0.97);
            }

            /* Ambient mesh glow */
            .ambient-glow {
                position: absolute;
                border-radius: 50%;
                filter: blur(100px);
                opacity: 0.45;
                pointer-events: none;
                animation: pulse-glow 8s ease-in-out infinite alternate;
            }

            .ambient-glow.violet {
                top: 20%;
                left: 25%;
                width: 380px;
                height: 380px;
                background: radial-gradient(circle, #7C3AED 0%, rgba(124, 58, 237, 0) 70%);
            }

            .ambient-glow.cyan {
                bottom: 20%;
                right: 25%;
                width: 350px;
                height: 350px;
                background: radial-gradient(circle, #06B6D4 0%, rgba(6, 182, 212, 0) 70%);
                animation-delay: -4s;
            }

            @keyframes pulse-glow {
                0% {
                    transform: scale(0.9) translate(0, 0);
                    opacity: 0.35;
                }
                100% {
                    transform: scale(1.15) translate(15px, -15px);
                    opacity: 0.55;
                }
            }

            /* Main Content Wrapper */
            .loading-content {
                position: relative;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 24px;
            }

            /* Emblem & Orbital Spinner */
            .emblem-wrapper {
                position: relative;
                width: 124px;
                height: 124px;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 28px;
            }

            /* Outer Conic Rotating Ring */
            .spinner-ring-outer {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                padding: 2.5px;
                background: conic-gradient(from 0deg, #7C3AED, #3B82F6, #06B6D4, #7C3AED);
                -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                -webkit-mask-composite: xor;
                mask-composite: exclude;
                animation: spin 2.4s linear infinite;
                filter: drop-shadow(0 0 16px rgba(124, 58, 237, 0.55));
            }

            /* Inner Dotted Counter-Orbit */
            .spinner-ring-inner {
                position: absolute;
                inset: 7px;
                border-radius: 50%;
                border: 1.5px dashed rgba(6, 182, 212, 0.4);
                animation: spin-reverse 8s linear infinite;
            }

            /* Glassmorphic Core Badge */
            .emblem-core {
                position: relative;
                width: 92px;
                height: 92px;
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, rgba(30, 27, 75, 0.8), rgba(15, 15, 26, 0.95));
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 
                    0 10px 25px -5px rgba(0, 0, 0, 0.6),
                    inset 0 0 16px rgba(124, 58, 237, 0.25);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                display: flex;
                justify-content: center;
                align-items: center;
                animation: emblem-breath 3s ease-in-out infinite;
            }

            /* Logo Image */
            .emblem-logo {
                width: 48px;
                height: auto;
                object-fit: contain;
                filter: drop-shadow(0 0 8px rgba(124, 58, 237, 0.6));
                user-select: none;
                -webkit-user-drag: none;
            }

            /* Brand Text */
            .brand-name {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 1.2px;
                margin: 0 0 6px 0;
                background: linear-gradient(135deg, #FFFFFF 20%, #E2E8F0 60%, #CBD5E1 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                text-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
            }

            .brand-role {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 3.5px;
                text-transform: uppercase;
                color: #64748B;
                margin: 0 0 28px 0;
            }

            /* Modern Gradient Progress Bar */
            .progress-track {
                width: 170px;
                height: 3.5px;
                background: rgba(255, 255, 255, 0.08);
                border-radius: 999px;
                overflow: hidden;
                position: relative;
                margin-bottom: 14px;
                box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
            }

            .progress-bar {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 45%;
                border-radius: 999px;
                background: linear-gradient(90deg, #7C3AED, #06B6D4);
                box-shadow: 0 0 12px rgba(6, 182, 212, 0.7);
                animation: progress-slide 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            }

            /* Status Text */
            .status-text {
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 2.2px;
                color: #475569;
                text-transform: uppercase;
            }

            .status-dots span {
                animation: dot-blink 1.4s infinite;
                opacity: 0;
            }
            .status-dots span:nth-child(1) { animation-delay: 0s; }
            .status-dots span:nth-child(2) { animation-delay: 0.2s; }
            .status-dots span:nth-child(3) { animation-delay: 0.4s; }

            /* Keyframe Animations */
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            @keyframes spin-reverse {
                0% { transform: rotate(360deg); }
                100% { transform: rotate(0deg); }
            }

            @keyframes emblem-breath {
                0%, 100% {
                    transform: scale(1);
                    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), inset 0 0 16px rgba(124, 58, 237, 0.25);
                }
                50% {
                    transform: scale(1.035);
                    box-shadow: 0 12px 30px -5px rgba(124, 58, 237, 0.3), inset 0 0 22px rgba(6, 182, 212, 0.3);
                }
            }

            @keyframes progress-slide {
                0% {
                    left: -45%;
                }
                100% {
                    left: 100%;
                }
            }

            @keyframes dot-blink {
                0%, 100% { opacity: 0; }
                50% { opacity: 1; }
            }
        </style>
    </head>
